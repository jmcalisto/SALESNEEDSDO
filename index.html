<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jill's Needs Analysis — Role-play</title>

<!--
====================================================================
  DISCOVERY & NEEDS ANALYSIS — DO SECTION ROLE-PLAY (photo scene)
  "Jill's Needs Analysis"
====================================================================
  TRANSLATION / LOCALISATION
  Everything a learner can see lives in the two objects below:
      UI        = interface labels and buttons
      SCENARIO  = the conversation itself
  To make a new language version: translate the text values inside
  these two objects and re-host. Nothing else changes.

  AUDIO (optional, per language)
  Every spoken line has an "audio" field set to null. Drop in a path
  to an ElevenLabs clip (e.g. audio:"audio/en/p1_jill.mp3") and it
  plays automatically. Leaving it null keeps the page text-only.

  SPEAKERS / SCENE
  The photo is a real consultation. Left = Jill (the learner she is
  talking to). Right = You, the consultant. Bubbles appear over the
  correct speaker. To swap the photo, replace the .scene-img source.
====================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Lora:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#EAEEF2; --card:#FFFFFF;
    --ink:#13263B; --ink-soft:#4A5C6E; --muted:#7E8D9B; --line:#DCE3EA;
    --navy:#0B2A4A; --accent:#D6231C; --warm:#2E7D5B;
    --warm-soft:#E3F0EA; --cool:#C0453E; --cool-soft:#FBEAE9;
    --you:#0B2A4A; --jill:#8A3A2E;
    /* fullscreen affordance — its own token, not --warm, which carries the
       warmth-meter meaning and would drift if that palette were retuned */
    --fs-green:#127A47; --fs-green-deep:#0D5F37;
    --shadow:0 1px 2px rgba(19,38,59,.06),0 8px 24px rgba(19,38,59,.08);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
  }
  /* fixed-size window — same footprint as the Show-section comics, light
     instead of dark. A pinned header + fixed-height scene + one panel
     mean everything for a phase fits without scrolling; .panel keeps a
     scroll fallback only as a safety net, not as the intended reading mode. */
  .stage{
    width:min(920px,96vw); height:min(640px,92vh);
    display:flex;flex-direction:column;overflow:hidden;
    border-radius:20px;
    box-shadow:0 1px 2px rgba(19,38,59,.06),0 20px 48px rgba(19,38,59,.14);
    background:var(--card);
    /* consumed by fitStage(): scale the fixed-size window up in fullscreen
       rather than stranding it as a postage stamp on a large monitor */
    transform:scale(var(--fs-scale,1));transform-origin:center center;
  }
  /* once the role-play is finished, the scene and rail/warmth give way
     entirely to the panel so the wrap-up has the full window to work with */
  .stage.finished .scene,
  .stage.finished .rail,
  .stage.finished .warmth{display:none}

  /* ---------- header / status ---------- */
  .topbar{
    background:var(--card);border-bottom:1px solid var(--line);
    padding:14px 20px 12px;flex-shrink:0;
  }
  .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 4px}
  .title{font-family:"Lora",Georgia,serif;font-weight:600;color:var(--navy);font-size:1.5rem;line-height:1.15;margin:0 0 12px}
  .rail{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
  .step{flex:1 1 0;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.62rem;color:var(--muted);text-align:center;font-weight:600;letter-spacing:.02em}
  .dot{width:100%;height:6px;border-radius:6px;background:var(--line);transition:background .4s ease}
  .step.done .dot{background:var(--warm)}
  .step.active .dot{background:var(--accent)}
  .step.active{color:var(--navy)} .step.done{color:var(--ink-soft)}
  .warmth{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .warmth-avatar{width:40px;height:40px;border-radius:50%;flex:0 0 auto;background:var(--warm-soft);color:var(--warm);display:flex;align-items:center;justify-content:center;font-weight:700;transition:background .4s,color .4s}
  .warmth-body{flex:1 1 auto;min-width:0}
  .warmth-label{display:flex;justify-content:space-between;align-items:baseline;font-size:.75rem;color:var(--ink-soft);font-weight:600;margin-bottom:5px}
  .warmth-state{color:var(--warm);transition:color .4s}
  .warmth-track{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
  .warmth-fill{height:100%;width:55%;border-radius:8px;background:var(--warm);transition:width .5s ease,background .4s ease}
  .cooling .warmth-avatar{background:var(--cool-soft);color:var(--cool)}
  .cooling .warmth-fill{background:var(--cool)} .cooling .warmth-state{color:var(--cool)}

  /* ---------- photo scene ---------- */
  .scene{
    position:relative;width:100%;overflow:hidden;
    background:#22303c;flex-shrink:0;height:200px;
  }
  .scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
  .scene::after{ /* soft top scrim so bubbles read on any photo */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 34%,rgba(0,0,0,0) 70%,rgba(0,0,0,.10) 100%);
  }
  .scene-note{
    position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    max-width:90%;text-align:center;z-index:5;
    background:rgba(11,42,74,.82);color:#fff;font-size:.8rem;font-weight:500;
    padding:6px 14px;border-radius:20px;backdrop-filter:blur(2px);
    transition:opacity .3s;
  }

  /* speech bubbles */
  .bubble{
    position:absolute;z-index:4;max-width:44%;
    background:#fff;border:2px solid var(--navy);border-radius:16px;
    padding:9px 13px 10px;box-shadow:0 6px 18px rgba(0,0,0,.22);
    opacity:0;transform:translateY(-6px) scale(.98);
    transition:opacity .3s ease,transform .3s ease;
  }
  .bubble.show{opacity:1;transform:none}
  .bubble.dim{opacity:.32}
  .bubble .sp{
    font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
    margin:0 0 3px;
  }
  .bubble .say{font-size:.9rem;color:var(--ink);line-height:1.4;margin:0}
  .bubble .tail{position:absolute;width:0;height:0}

  /* Jill = left speaker (head ~24% / 40%) */
  .bubble.jill{left:3%;top:4%;border-color:var(--jill)}
  .bubble.jill .sp{color:var(--jill)}
  .bubble.jill .tail{
    bottom:-13px;left:34%;
    border-left:11px solid transparent;border-right:11px solid transparent;
    border-top:14px solid var(--jill);
  }
  .bubble.jill .tail::after{
    content:"";position:absolute;top:-14px;left:-8px;
    border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #fff;
  }
  /* You = right speaker (head ~66% / 34%) */
  .bubble.you{right:3%;top:4%;border-color:var(--you)}
  .bubble.you .sp{color:var(--you)}
  .bubble.you .say{font-weight:500}
  .bubble.you .tail{
    bottom:-13px;right:34%;
    border-left:11px solid transparent;border-right:11px solid transparent;
    border-top:14px solid var(--you);
  }
  .bubble.you .tail::after{
    content:"";position:absolute;top:-14px;left:-8px;
    border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #fff;
  }

  /* ---------- interaction panel ---------- */
  .panel{
    background:var(--card);border-top:1px solid var(--line);
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:18px 20px;position:relative;z-index:6;
  }
  .prompt-q{font-weight:700;color:var(--navy);margin:0 0 10px;font-size:1rem}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice.other-hidden{display:none}
  .choice{
    text-align:left;width:100%;cursor:pointer;background:var(--card);
    border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;
    font:inherit;color:var(--ink);font-size:.96rem;
    transition:border-color .15s,background .15s,transform .05s;
  }
  .choice:hover{border-color:var(--navy);background:#F7FAFC}
  .choice:focus-visible{outline:3px solid #A9C7E8;outline-offset:2px}
  .choice:active{transform:translateY(1px)}
  .choice[disabled]{cursor:default;opacity:.55}
  .choice.picked-good{border-color:var(--warm);background:var(--warm-soft)}
  .choice.picked-bad{border-color:var(--cool);background:var(--cool-soft)}

  .verdict{margin-top:10px;border-radius:12px;padding:10px 14px;font-size:.9rem;animation:rise .3s ease both}
  .verdict.good{background:var(--warm-soft);border:1px solid #BFE0CE}
  .verdict.bad{background:var(--cool-soft);border:1px solid #F0CFCC}
  .verdict .tag{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:4px}
  .verdict.good .tag{color:var(--warm)} .verdict.bad .tag{color:var(--cool)}
  .verdict p{margin:0}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .actions{margin-top:12px;display:flex;justify-content:flex-end;gap:10px}
  .btn{font:inherit;font-weight:700;font-size:.92rem;cursor:pointer;border-radius:10px;padding:11px 20px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;transition:background .15s,transform .05s}
  .btn:hover{background:#123a63} .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:3px solid #A9C7E8;outline-offset:2px}
  .btn.ghost{background:transparent;color:var(--navy)} .btn.ghost:hover{background:#EDF3F8}

  .setup-body{color:var(--ink-soft);margin:0 0 10px;font-size:.94rem}

  /* ---------- final ---------- */
  .final{padding:4px 2px 0}
  .final .badge{width:44px;height:44px;border-radius:50%;margin:0 auto 8px;background:var(--warm-soft);color:var(--warm);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
  .final h2{font-family:"Lora",Georgia,serif;font-weight:600;color:var(--navy);font-size:1.2rem;margin:0 0 6px;text-align:center}
  .final .lead{color:var(--ink-soft);margin:0 auto 12px;max-width:60ch;text-align:center;font-size:.92rem}
  .recap{margin:0 0 12px}
  .recap h3{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .recap ul{list-style:none;margin:0;padding:0}
  .recap li{position:relative;padding-left:16px;margin:0 0 6px;font-size:.88rem;line-height:1.4;color:var(--ink)}
  .recap li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--warm)}
  .code-box{display:block;width:max-content;margin:0 auto;padding:8px 18px;border:2px dashed var(--navy);border-radius:12px;background:#F7FAFC;text-align:center}
  .code-box .lbl{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:2px}
  .code-box .code{font-family:"Lora",Georgia,serif;font-size:1.3rem;font-weight:600;letter-spacing:.06em;color:var(--navy)}
  .final .foot{text-align:center;color:var(--ink-soft);margin:10px auto 0;max-width:52ch;font-size:.86rem}

  @media (max-width:560px){
    .stage{width:100vw;height:100vh;border-radius:0}
    /* the centred button would otherwise sit on top of the eyebrow and the
       language select; give it a band of its own and trim it to clear them */
    .topbar{padding-top:50px}
    .fs-btn{height:30px;padding:0 12px;font-size:.72rem;gap:6px}
    .scene{height:160px}
    .title{font-size:1.25rem}
    .step{font-size:0;min-width:0}
    .bubble{max-width:66%;padding:7px 10px 8px}
    .bubble .say{font-size:.76rem}
    .bubble.jill{top:2%;left:2%}
    .bubble.you{top:34%;right:2%}   /* staggered lower so the two never overlap */
    .scene-note{font-size:.66rem;bottom:6px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

  /* Fullscreen button — centred at the top of the stage and deliberately loud.
     In an LMS iframe the lower half of the activity often sits below the fold,
     and a learner who never finds this button never sees that half. Solid green
     rather than the Do-section ghost vocabulary, so it reads as the one control
     that is chrome rather than part of the role-play. Still absolutely
     positioned, so it costs no vertical height inside the fixed stage. */
  .fs-btn{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:30;
    display:inline-flex;align-items:center;gap:8px;
    height:34px;padding:0 16px;background:var(--fs-green);color:#fff;
    border:0;border-radius:999px;
    font:inherit;font-size:.78rem;font-weight:800;letter-spacing:.02em;
    white-space:nowrap;cursor:pointer;
    box-shadow:0 2px 10px rgba(18,122,71,.35);
    transition:background .15s,box-shadow .15s}
  .fs-btn:hover{background:var(--fs-green-deep);box-shadow:0 4px 14px rgba(18,122,71,.45)}
  .fs-btn:focus-visible{outline:3px solid #A9C7E8;outline-offset:2px}
  /* while fullscreen the button has done its job — drop it back to navy so it
     stops competing with the activity for attention */
  .fs-btn.is-on{background:var(--navy);box-shadow:none}

  /* language switcher — header, top-right, in the row the fullscreen button
     vacated when it moved to centre. ?lang= stays the primary mechanism for
     LMS embeds. */
  .langbar{position:absolute;top:12px;inset-inline-end:16px}
  .langbar select{font:inherit;font-size:.72rem;font-weight:700;color:var(--navy);
    background:transparent;border:1.5px solid var(--line);border-radius:10px;
    padding:5px 8px;cursor:pointer}
  .langbar select:focus-visible{outline:3px solid #A9C7E8;outline-offset:2px}

  /* ---------- right-to-left (Arabic) ----------
     Reading-order chrome flips on its own. The speech bubbles do not: Jill is
     on the left of frame and You on the right, so they stay with the people in
     the photo rather than swapping sides. */
  [dir="rtl"] body{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif}
  [dir="rtl"] .title,[dir="rtl"] .final h2,[dir="rtl"] .code-box .code{
    font-family:'Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;font-weight:700}
  [dir="rtl"] .eyebrow{letter-spacing:0}
</style>
</head>
<body>
<div class="stage">
  <header class="topbar">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="title" id="title"></h1>
    <button class="fs-btn" id="fsBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><span class="fs-label" aria-live="polite"></span></button>
    <div class="langbar"><select id="langsel" aria-label="Language"></select></div>
    <div class="rail" id="rail" aria-label="Conversation phases"></div>
    <div class="warmth" id="warmthWrap">
      <div class="warmth-avatar" id="warmthAvatar">J</div>
      <div class="warmth-body">
        <div class="warmth-label"><span id="warmthName"></span><span class="warmth-state" id="warmthState"></span></div>
        <div class="warmth-track" aria-hidden="true"><div class="warmth-fill" id="warmthFill"></div></div>
      </div>
    </div>
  </header>

  finalFoot:"Enter this code on the next screen to record that you finished the role-play.",
  personaName:"Jill",
  personaIntro:"Jill, 23, has failed two English entrance exams and dreams of studying in the US. Friendly but discouraged. You're her consultant — this is her first appointment.",
  phases_text:[
   {note:"Jill has just sat down. This is the very start of the appointment.",
    lead:"Hi… yes, I'm Jill. Sorry, I'm a little nervous.",
    question:"How do you open?",
    opts:["“Hi Jill, it's really nice to meet you. Thank you for coming in today. How was your journey over?”",
          "“Great, you're here for English classes. Let me show you what we offer.”",
          "“You want to improve your English, correct?”"],
    reactions:["Oh, thank you. It was fine, actually. I'm feeling a bit better already.",
               "Oh… okay. I haven't really said what I'm looking for yet.",
               "Um, yes… I suppose so."],
    coaches:["A warm, easy opening lets Jill relax — that's how trust starts.",
             "That's product before person. Earn the right to present later — start with warmth.",
             "A closed question makes a cold start — open like a real welcome, not a form."]},
   {note:"Jill is settled. Now you want to understand her story with English.",
    question:"You want to learn about her past with English. What do you ask?",
    opts:["“Can you tell me a little about your experience with English so far?”",
          "“Did you study English at school? For how many years?”"],
    reactions:["I studied it at school and at university. But I've failed the entrance exam twice now. I always get stuck when I have to speak.",
               "Yes. About ten years, I think."],
    coaches:["An open question let Jill tell her own story — and she just shared something important.",
             "Closed questions get short answers — you learned a number, not her story. Remember, the prospect should be doing 80% of the talking."]},
   {note:"You know a little of her past. Now the present — where English sits in her life today.",
    question:"How do you explore her present situation?",
    opts:["“And right now, where do you notice English matters most in your daily life?”",
          "“Don't worry — our method fixes speaking problems quickly.”"],
    reactions:["Mostly at university. My reading is okay, honestly. But speaking in seminars really scares me.",
               "Right… but you don't really know my situation yet."],
    coaches:["Now you know the real difficulty: speaking, not reading. That's discovery working.",
             "This is how warm leads go cold: solution before need. Stay in discovery a little longer."]},
   {note:"You understand her present. Now open the future — where she wants English to take her.",
    question:"How do you open up her future?",
    opts:["“Where would you like your English to take you? What's the dream?”",
          "“So you just want to pass your exam, right?”"],
    reactions:["Honestly? I want to study at a university in the United States. That's the real dream.",
               "Well… yes, but there's more to it than that."],
    coaches:["An open future question let the real goal surface. This is far bigger than ‘pass an exam’.",
             "A closed question boxes her in — open the future so the real dream can come out."]},
   {note:"She has shared a big dream. Stay human for a moment before you dig deeper.",
    question:"She has just named a big goal. What do you do?",
    opts:["“That's a wonderful goal. What is it about studying in the US that excites you most?”",
          "“Great. Let's look at which course would fit you best.”"],
    reactions:["My older brother studied there. I've wanted it since I was a kid. But after failing twice… I started to think maybe it's just not for me.",
               "Oh — okay. I thought we were still talking about my goals."],
    coaches:["One more human question — and the door to the Hot Button opens. Notice what she just admitted.",
             "Rushing to the course here skips the most valuable moment — one more human question reveals the Hot Button."]},
   {note:"She has just shown you a feeling: after failing twice, she doubts herself. This is the Hot Button.",
    question:"This is the emotional heart of the conversation. How do you respond?",
    opts:["“It sounds like this really matters to you, and those two exams knocked your confidence. What would it mean to you to finally get there?”",
          "“Okay, so what you need is a higher test score.”",
          "“Let's not dwell on that. Let me show you our programme.”"],
    reactions:["It would mean everything. It would prove to myself that failing twice didn't define me.",
               "I mean… yes. But it's not really about the score.",
               "…Sure. I guess."],
    coaches:["You reflected the feeling first, then asked. That's the Hot Button — the emotional reason she will commit.",
             "That's the rational need, but the Hot Button is emotional — reflect the feeling first.",
             "Skipping the Hot Button is the #1 way a warm lead goes cold — this feeling is why she'll say yes."]},
   {note:"You have everything you need. Before any solution, frame back what you heard.",
    question:"How do you close the Needs Analysis?",
    opts:["“So let me check I've understood. You want to study in the US, your reading is solid, speaking is where you want to grow, and getting there would prove to yourself what you're capable of. Have I got that right?”",
          "“Perfect. Here's our twelve-month course and the price.”"],
    reactions:["Yes. Exactly. That's it — you really listened.",
               "Oh — that's a lot, all at once. I'm not sure."],
    coaches:["Framing back what you heard earns the right to present a solution next.",
             "Frame before you present — confirming what you heard bridges discovery to the solution."]}
  ]

          "«لا داعي للتوقف عند هذا. دعيني أعرض عليكِ برنامجنا.»"],
    reactions:["سيعني لي كل شيء. سيثبت لنفسي أن الرسوب مرتين لا يحدّد من أكون.",
               "أقصد… نعم. لكن الأمر ليس متعلقًا بالدرجة حقًا.",
               "…حسنًا. كما تشاء."],
    coaches:["عكست الشعور أولًا ثم سألت. هذه هي النقطة الحساسة — السبب العاطفي الذي سيدفعها للالتزام.",
             "تلك هي الحاجة المنطقية، أما النقطة الحساسة فهي عاطفية — اعكس الشعور أولًا.",
             "تخطّي النقطة الحساسة هو السبب الأول لبرود عميل مهتم — هذا الشعور هو ما سيجعلها تقول نعم."]},
   {note:"لديك كل ما تحتاجه. قبل أي حل، أعد صياغة ما سمعته.",
    question:"كيف تُنهي تحليل الاحتياجات؟",
    opts:["«دعيني أتأكد أنني فهمت. تريدين الدراسة في الولايات المتحدة، وقراءتكِ جيدة، والتحدث هو ما تريدين تطويره، والوصول إلى هناك سيثبت لكِ ما أنتِ قادرة عليه. هل فهمت بشكل صحيح؟»",
          "«ممتاز. إليكِ دورتنا لاثني عشر شهرًا والسعر.»"],
    reactions:["نعم. بالضبط. هذا هو — لقد أصغيت إليّ فعلًا.",
               "أوه — هذا كثير، ودفعة واحدة. لست متأكدة."],
    coaches:["إعادة صياغة ما سمعته تمنحك الحق في عرض الحل بعد ذلك.",
             "أطّر قبل أن تعرض — تأكيد ما سمعته هو الجسر بين الاستكشاف والحل."]}
  ]
}

};

const LANG_NAMES={en:"English",it:"Italiano",pt:"Português",es:"Español",fr:"Français",ar:"العربية"};
const RTL=["ar"];

function normalizeLang(l){
  if(!l) return "en";
  l=String(l).toLowerCase();
  if(I18N[l]) return l;
  const base=l.split("-")[0];
  return I18N[base]?base:"en";
}
const LANG=normalizeLang(new URLSearchParams(location.search).get("lang")||navigator.language);
document.documentElement.dir=RTL.indexOf(LANG)>=0?"rtl":"ltr";

const T=I18N[LANG];
const UI={
  lang:T.lang, fs:T.fs, eyebrow:T.eyebrow, title:T.title,
  warmthName:T.warmthName, warmthStates:T.warmthStates,
  continueBtn:T.continueBtn, tryAgainBtn:T.tryAgainBtn,
  setupHeading:T.setupHeading, setupTask:T.setupTask, startBtn:T.startBtn,
  youLabel:T.youLabel, jillLabel:T.jillLabel, phases:T.phases,
  recapTitle:T.recapTitle, recapBullets:T.recapBullets,
  finalBadge:T.finalBadge, finalTitle:T.finalTitle, finalBody:T.finalBody,
  codeLabel:T.codeLabel, code:T.code, finalFoot:T.finalFoot
};
/* rebuild the scenario from shared structure + this language's text */
const SCENARIO={
  persona:{name:T.personaName, intro:T.personaIntro},
  startWarmth:START_WARMTH,
  phases:SHAPE.map((sh,i)=>{
    const t=T.phases_text[i];
    const p={key:sh.key, note:t.note, question:t.question,
      options:t.opts.map((label,j)=>({
        correct:j===sh.correct, delta:sh.delta[j], text:label,
        reaction:{text:t.reactions[j], audio:null}, coach:t.coaches[j]
      }))};
    if(sh.lead) p.lead={text:t.lead, audio:null};
    return p;
  })
};

/* =====================================================================
   3. ENGINE — no learner-facing text below this line
   ===================================================================== */
(function(){
  const $ = id => document.getElementById(id);
  const interaction = $("interaction");
  const bJill = $("bubbleJill"), bYou = $("bubbleYou");

  let phaseIndex = 0, warmth = SCENARIO.startWarmth, resolved = false;
  /* Jill's line currently on screen, and the one this phase opened with.
     Only the opening phase carries a `lead`, so from phase 2 on the line
     the learner is replying to IS her reaction to the previous answer --
     it has to survive the phase change, and has to come back on retry. */
  let jillLine = null, phaseOpenJill = null;

  $("eyebrow").textContent = UI.eyebrow;
  $("title").textContent = UI.title;
  $("warmthName").textContent = UI.warmthName;
  $("jillSp").textContent = UI.jillLabel;
  $("youSp").textContent = UI.youLabel;

  const rail = $("rail");
  UI.phases.forEach((label,i)=>{
    const s=document.createElement("div"); s.className="step"; s.id="step-"+i;
    s.innerHTML='<span class="dot"></span><span>'+label+'</span>'; rail.appendChild(s);
  });

  function playAudio(line){ if(line&&line.audio){ try{ new Audio(line.audio).play().catch(()=>{});}catch(e){} } }

  function setBubble(side, text){
    const b = side==="jill"?bJill:bYou;
    const say = side==="jill"?$("jillSay"):$("youSay");
    if(text===null){ b.classList.remove("show","dim"); if(side==="jill") jillLine=null; return; }
    say.textContent = text.replace(/^\u201c|\u201d$/g,"");
    b.classList.remove("dim"); b.classList.add("show");
    if(side==="jill") jillLine = text;
  }
  function dim(side){ (side==="jill"?bJill:bYou).classList.add("dim"); }
  function undim(side){ (side==="jill"?bJill:bYou).classList.remove("dim"); }
  function clearBubbles(){ setBubble("jill",null); setBubble("you",null); }

  function renderRail(){
    UI.phases.forEach((_,i)=>{
      const s=$("step-"+i); s.classList.remove("done","active");
      if(i<phaseIndex) s.classList.add("done"); else if(i===phaseIndex) s.classList.add("active");
    });
  }
  function band(){ return warmth>=75?"high":warmth>=50?"mid":warmth>=30?"low":"cold"; }
  function renderWarmth(){
    $("warmthFill").style.width = Math.max(6,Math.min(100,warmth))+"%";
    const bd=band(); $("warmthState").textContent=UI.warmthStates[bd];
    $("warmthWrap").classList.toggle("cooling", bd==="low"||bd==="cold");
  }

  function renderSetup(){
    clearBubbles();
    $("sceneNote").textContent = "";
    UI.phases.forEach((_,i)=>$("step-"+i).classList.remove("done","active"));
    interaction.innerHTML =
      '<p class="prompt-q">'+UI.setupHeading+'</p>'+
      '<p class="setup-body">'+SCENARIO.persona.intro+'</p>'+
      '<p class="setup-body">'+UI.setupTask+'</p>';
    const a=document.createElement("div"); a.className="actions";
    const s=document.createElement("button"); s.className="btn"; s.textContent=UI.startBtn;
    s.addEventListener("click",renderPhase); a.appendChild(s); interaction.appendChild(a);
  }

  function shuffle(a){
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function renderPhase(){
    resolved=false; renderRail();
    const ph=SCENARIO.phases[phaseIndex];
    /* Clear only YOUR previous answer. Wiping Jill's bubble too would leave
       the learner choosing a reply with nothing on screen to reply to, since
       no phase after the first supplies an opening line of its own. */
    setBubble("you", null);
    $("sceneNote").textContent = ph.note || "";
    if(ph.lead){ setBubble("jill",ph.lead.text); playAudio(ph.lead); }
    else undim("jill");   // carried over from the last phase, and live again
    phaseOpenJill = jillLine;

    interaction.innerHTML="";
    const q=document.createElement("p"); q.className="prompt-q"; q.textContent=ph.question; interaction.appendChild(q);
    const list=document.createElement("div"); list.className="choices";
    shuffle(ph.options.slice()).forEach(opt=>{
      const b=document.createElement("button"); b.type="button"; b.className="choice"; b.innerHTML=opt.text;
      b.addEventListener("click",()=>choose(ph,opt,b,list)); list.appendChild(b);
    });
    interaction.appendChild(list);
  }

  function choose(ph, opt, button, list){
    if(resolved) return;

    // your line appears over the consultant; the earlier Jill bubble dims
    dim("jill");
    setBubble("you", opt.text); playAudio({audio:null});
    // Jill reacts (replaces her lead bubble)
    setTimeout(()=>{ setBubble("jill", opt.reaction.text); playAudio(opt.reaction); }, 220);

    warmth += (opt.delta||0); renderWarmth();

    Array.from(list.children).forEach(c=>{ c.disabled=true; if(c!==button) c.classList.add("other-hidden"); });
    button.classList.add(opt.correct?"picked-good":"picked-bad");

    const v=document.createElement("div"); v.className="verdict "+(opt.correct?"good":"bad");
    v.innerHTML='<span class="tag">'+(opt.correct?"Good move":"Let's rethink that")+'</span><p>'+opt.coach+'</p>';
    interaction.appendChild(v);

    const actions=document.createElement("div"); actions.className="actions";
    if(opt.correct){
      resolved=true;
      const n=document.createElement("button"); n.className="btn"; n.textContent=UI.continueBtn;
      n.addEventListener("click",advance); actions.appendChild(n);
    }else{
      const r=document.createElement("button"); r.className="btn ghost"; r.textContent=UI.tryAgainBtn;
      r.addEventListener("click",()=>{
        v.remove(); actions.remove();
        warmth -= (opt.delta||0); renderWarmth();
        setBubble("you",null);
        setBubble("jill", phaseOpenJill);   // restore whatever opened this phase
        Array.from(list.children).forEach(c=>{ c.disabled=false; c.classList.remove("picked-good","picked-bad","other-hidden"); });
      });
      actions.appendChild(r);
    }
    interaction.appendChild(actions);
  }

  function advance(){
    phaseIndex++;
    if(phaseIndex>=SCENARIO.phases.length){ finish(); return; }
    renderPhase();
  }

  function finish(){
    phaseIndex=SCENARIO.phases.length; renderRail();
    warmth=Math.max(warmth,80); renderWarmth();
    clearBubbles(); $("sceneNote").textContent="";
    document.querySelector(".stage").classList.add("finished");

    let recap='<div class="recap"><h3>'+UI.recapTitle+'</h3><ul>'+
      UI.recapBullets.map(b=>'<li>'+b+'</li>').join('')+
      '</ul></div>';

    interaction.innerHTML=
      '<div class="final">'+
        '<div class="badge">'+UI.finalBadge+'</div>'+
        '<h2>'+UI.finalTitle+'</h2>'+
        '<p class="lead">'+UI.finalBody+'</p>'+
        recap+
        '<div class="code-box"><span class="lbl">'+UI.codeLabel+'</span><span class="code">'+UI.code+'</span></div>'+
        '<p class="foot">'+UI.finalFoot+'</p>'+
      '</div>';
  }


  /* ===== fullscreen =====
     The stage sizes itself to whatever box it is embedded in, and we do not
     control that box. An LMS iframe taller than the learner's visible area puts
     the lower half of the activity below the fold, where nothing inside the
     iframe can detect it. This is the escape hatch.

     Our LMS embed grants allowfullscreen, so this is a real Fullscreen API
     call, never a new tab: popping out to a tab loses the learner's place in
     the course and orphans them outside the player. The only fallback left is
     an inline F11 hint for the case where the request is refused anyway.
     Ported from SANDBOXTEMPLATE; the toast and i18n lookups it relied on do
     not exist here, so the labels come from the activity's own copy object. */
  const FS = UI.fs;
  const FS_W = 920, FS_H = 640;
  const fsBtn = document.getElementById("fsBtn");
  const fsLabelEl = fsBtn && fsBtn.querySelector(".fs-label");
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  // false when the embedding iframe carries no allowfullscreen
  const fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  let fsMode = fsSupported ? "fullscreen" : "hint";
  let fsHintTimer;

  function syncFsLabel(){
    if(!fsBtn) return;
    const on = !!fsEl();
    const t = on ? FS.exit : FS.enter;
    fsLabelEl.textContent = t; fsBtn.title = t;
    fsBtn.classList.toggle("is-on", on);
    fsBtn.setAttribute("aria-pressed", on ? "true" : "false");
  }
  // there is no toast component in these activities, so the hint borrows the
  // button's own label for a few seconds
  function fsHint(){
    if(!fsBtn) return;
    fsLabelEl.textContent = FS.hint; fsBtn.title = FS.hint;
    clearTimeout(fsHintTimer); fsHintTimer = setTimeout(syncFsLabel, 4000);
  }
  function fsDemote(){ fsMode = "hint"; syncFsLabel(); fsHint(); }

  /* Scale the stage rather than stretch it. This is a fixed 920xH design, so
     plain fullscreen on a large monitor would just centre a postage stamp in a
     huge field and read as broken. Text scales as vectors and nothing reflows. */
  function fitStage(){
    const st = document.querySelector(".stage"); if(!st) return;
    const s = fsEl() ? Math.min(innerWidth / FS_W, innerHeight / FS_H) : 1;
    st.style.setProperty("--fs-scale", Math.max(1, Math.min(2, s)).toFixed(3));
  }

  function toggleFullscreen(){
    if(fsMode === "hint"){ fsHint(); return; }
    if(fsEl()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    /* documentElement, NOT .stage: element fullscreen forces width/height:100%
       over the fixed design and paints an opaque black ::backdrop, which would
       replace the activity's own ground. */
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(!req){ fsDemote(); return; }
    // webkitRequestFullscreen returns undefined rather than a Promise, and a
    // request can still be refused after fullscreenEnabled read true
    Promise.resolve(req.call(el)).catch(fsDemote);
  }

  if(fsBtn) fsBtn.addEventListener("click", toggleFullscreen);
  /* The change event is the source of truth, never the click handler: Esc, F11,
     a refused request and the window manager all change state without it. */
  ["fullscreenchange","webkitfullscreenchange"].forEach(ev =>
    document.addEventListener(ev, () => { syncFsLabel(); fitStage(); }));
  addEventListener("resize", fitStage);
  syncFsLabel(); fitStage();


  /* ----- language switcher ----- */
  (function(){
    const sel=document.getElementById("langsel"); if(!sel) return;
    Object.keys(I18N).forEach(c=>{
      const o=document.createElement("option");
      o.value=c; o.textContent=LANG_NAMES[c]||c; if(c===LANG) o.selected=true;
      sel.appendChild(o);
    });
    sel.addEventListener("change",()=>{
      const u=new URL(location.href); u.searchParams.set("lang",sel.value); location.href=u.toString();
    });
  })();
  document.documentElement.lang = UI.lang;
  renderWarmth(); renderSetup();
})();
</script>
</body>
</html>
